apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        # Wildcard *.k8s.myrobots.co.kr -> <NFS_PRIVATE_IP> (myubuntu).
        # The 'hosts' plugin cannot do wildcards, so 'template' synthesises the A record.
        # The regex requires a label before "k8s", so the apex k8s.myrobots.co.kr
        # does NOT match here and is served by the 'hosts' block below instead.
        template IN A k8s.myrobots.co.kr {
           match "^.*\.k8s\.myrobots\.co\.kr\.$"
           answer "{{ .Name }} 60 IN A <NFS_PRIVATE_IP>"
           fallthrough
        }
        # Answer AAAA authoritatively as NODATA. Clients (glibc/musl) query A and AAAA
        # in parallel; without this the AAAA would be forwarded upstream on every
        # lookup, adding latency and leaking internal hostnames to public resolvers.
        template IN AAAA k8s.myrobots.co.kr {
           match "^.*\.k8s\.myrobots\.co\.kr\.$"
           rcode NOERROR
           authority "k8s.myrobots.co.kr. 60 IN SOA ns.k8s.myrobots.co.kr. hostmaster.k8s.myrobots.co.kr. 1 60 60 60 60"
        }
        # Static single-name overrides, also pointing at myubuntu (<NFS_PRIVATE_IP>).
        # 'fallthrough' is required: without it every unmatched name would NXDOMAIN
        # here instead of continuing on to the kubernetes and forward plugins.
        hosts {
           <NFS_PRIVATE_IP> k8s.myrobots.co.kr
           <NFS_PRIVATE_IP> minio.myrobots.co.kr
           ttl 60
           fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
