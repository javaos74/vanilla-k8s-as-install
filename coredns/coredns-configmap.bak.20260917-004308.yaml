apiVersion: v1
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        # Static in-cluster overrides pointing at infra-01 (<NFS_PRIVATE_IP>).
        # 'fallthrough' is required: without it every unmatched name would NXDOMAIN
        # here instead of continuing on to the kubernetes and forward plugins.
        hosts {
           <NFS_PRIVATE_IP> k8s.myrobots.co.kr
           <NFS_PRIVATE_IP> minio.myrobots.co.kr
           ttl 60
           fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
