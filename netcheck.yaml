apiVersion: v1
kind: Pod
metadata:
  name: netcheck-cp
  namespace: default
  labels: { app: netcheck }
spec:
  nodeName: k8s-cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: c
      image: curlimages/curl:8.11.1
      command: ["sleep", "1800"]
---
