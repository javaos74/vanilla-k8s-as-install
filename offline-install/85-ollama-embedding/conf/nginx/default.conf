# 발급할 Bearer API Key 검증 매핑
map $http_authorization $is_authorized {
    default 0;
    # 키 값은 이 파일에 쓰지 않는다. install.sh 가 ollama-embedding.env 의 키로
    # /etc/nginx/secrets/api-key.map 에 `"Bearer <키>" 1;` 한 줄을 만든다.
    include /etc/nginx/secrets/api-key.map;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 128M;

    location / {
        # 1. API Key 검증 및 OpenAI 포맷 에러 반환 (default_type을 if 밖으로 이동)
        default_type application/json;
        if ($is_authorized = 0) {
            return 401 '{"error": {"message": "Invalid or missing API key.", "type": "invalid_request_error", "code": "invalid_api_key"}}';
        }

        # 2. 로컬 Ollama 전달 (compose 서비스 이름)
        proxy_pass http://ollama:11434;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 3. LLM 스트리밍/버퍼링 비활성화 및 타임아웃
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
