#---------------------------------------------------------------------
# L4 (mode tcp) load balancer  —  myubuntu (<NFS_PRIVATE_IP> / <NFS_PUBLIC_IP>)
#
# Frontend ports : 443 (HTTPS), 80 (HTTP), 15021 (Istio status/ready)
# Backends       : k8s-01/02/03 worker nodes
#
# TLS pass-through only — HAProxy does NOT terminate TLS.
# Health check for 80/443 uses the Istio gateway readiness endpoint
# (GET /healthz/ready on port 15021).
#
# Run (host network is required to bind 80/443/15021 on the node):
#   sudo docker run -d --name haproxy --restart unless-stopped \
#     --network host \
#     -v /home/ubuntu/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
#     haproxy:latest
#   sudo docker kill -s HUP haproxy      # reload after editing this file
#---------------------------------------------------------------------

global
    log stdout format raw local0 info
    maxconn 60000
    # runtime API (container-local only)
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    # never run as root inside the container
    user  haproxy
    group haproxy

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    retries                 3
    timeout connect         5s
    timeout client          1h
    timeout server          1h
    timeout queue           30s
    timeout check           5s
    default-server          inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# HTTPS  443  ->  worker:443
#---------------------------------------------------------------------
frontend fe_https
    bind *:443
    default_backend be_https

backend be_https
    balance leastconn
    # sticky by source IP; drop this line for pure round-robin behaviour
    stick-table type ip size 200k expire 30m
    stick on src
    option httpchk GET /healthz/ready
    http-check expect status 200
    server k8s-01 <WORKER01_PRIVATE_IP>:443 check port 15021
    server k8s-02 <WORKER02_PRIVATE_IP>:443 check port 15021
    server k8s-03 <WORKER03_PRIVATE_IP>:443  check port 15021

#---------------------------------------------------------------------
# HTTP  80  ->  worker:80
#---------------------------------------------------------------------
frontend fe_http
    bind *:80
    default_backend be_http

backend be_http
    balance leastconn
    option httpchk GET /healthz/ready
    http-check expect status 200
    server k8s-01 <WORKER01_PRIVATE_IP>:80 check port 15021
    server k8s-02 <WORKER02_PRIVATE_IP>:80 check port 15021
    server k8s-03 <WORKER03_PRIVATE_IP>:80  check port 15021

#---------------------------------------------------------------------
# Istio status / readiness  15021  ->  worker:15021
#---------------------------------------------------------------------
frontend fe_status
    bind *:15021
    default_backend be_status

backend be_status
    balance roundrobin
    option httpchk GET /healthz/ready
    http-check expect status 200
    server k8s-01 <WORKER01_PRIVATE_IP>:15021 check
    server k8s-02 <WORKER02_PRIVATE_IP>:15021 check
    server k8s-03 <WORKER03_PRIVATE_IP>:15021  check

#---------------------------------------------------------------------
# Stats / monitoring — bound to loopback only, so it is not reachable
# from the network. If you expose it, add "stats auth user:pass".
#---------------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s

#---------------------------------------------------------------------
# NodePort variant — use this instead of the blocks above if the Istio
# ingress gateway is exposed as a NodePort service rather than on the
# host ports 80/443/15021. Replace the ports with the real values from:
#   kubectl -n istio-system get svc istio-ingressgateway -o yaml
#
# backend be_https      -> <node>:30443   check port 30021
# backend be_http       -> <node>:30080   check port 30021
# backend be_status     -> <node>:30021   check
#
# Client source IP is lost in L4 pass-through. If the gateway is
# configured to accept PROXY protocol, append "send-proxy-v2" to each
# server line to preserve it.
#---------------------------------------------------------------------
