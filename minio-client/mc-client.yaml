# MinIO 연결 확인용 mc(mcli) 클라이언트 파드
#
# 사전 준비 — 아래 두 리소스를 먼저 만든다. 자격증명을 파일로 남기지 않기 위해
# 값을 인자로 직접 넘긴다(셸 history 에 남지 않게 앞에 공백을 두거나 read 를 쓸 것).
#
#   kubectl create ns minio-test
#
#   # 1) MinIO 서버 인증서를 발급한 CA. 서버의 public.crt 를 그대로 쓴다.
#   #    05-certs 를 썼다면 /opt/pki/minio/ca.crt 다.
#   kubectl -n minio-test create configmap minio-ca \
#       --from-file=minio-ca.crt=/opt/pki/minio/ca.crt
#
#   # 2) 접속 자격증명
#   kubectl -n minio-test create secret generic minio-creds \
#       --from-literal=username='<MINIO_ROOT_USER>' \
#       --from-literal=password='<MINIO_ROOT_PASSWORD>'
#
# 적용과 사용:
#   kubectl apply -f mc-client.yaml
#   kubectl -n minio-test exec -it deploy/mc-client -- mcli ls minio
#
# 정리:
#   kubectl delete ns minio-test
#
# MC_URL 의 호스트명은 자신의 MinIO 주소로 바꿀 것.
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-test
---
# MinIO 가 사내 CA(또는 자가서명) 인증서를 쓰므로 CA 를 파드에 넣어야 한다.
# mc 는 ~/.mc/certs/CAs 아래의 인증서를 신뢰한다.
#   - ConfigMap minio-ca   : 키 이름이 minio-ca.crt 여야 한다(파일로 마운트된다)
#   - Secret    minio-creds: username / password
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-client
  namespace: minio-test
  labels:
    app: mc-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-client
  template:
    metadata:
      labels:
        app: mc-client
    spec:
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          env:
            # mc 는 argv[0] 로 설정 디렉터리를 정한다(mcli -> /root/.mcli).
            # /root 는 쓰기 불가이므로 두 이름이 같은 디렉터리를 쓰도록 고정한다.
            # CA 볼륨 마운트 덕에 /root/.mc 는 쓰기 가능하게 생성된다.
            - name: MC_CONFIG_DIR
              value: /root/.mc
            - name: MC_URL
              value: https://minio.myrobots.co.kr:9000
            - name: MC_ALIAS
              value: minio
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: username
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # 패키지로 설치했을 때의 이름(mcli)으로도 부를 수 있게 심링크.
              # /usr/bin 은 이 이미지에서 r-xr-xr-x 이고 CAP_DAC_OVERRIDE 를 drop 했으므로
              # 쓰기 가능한 /usr/local/bin 에 만든다 (PATH 에 이미 포함).
              ln -sf /usr/bin/mc /usr/local/bin/mcli
              # alias 등록 (자격증명은 env -> ~/.mc/config.json 에만 존재)
              mc alias set "$MC_ALIAS" "$MC_URL" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null
              echo "alias '$MC_ALIAS' -> $MC_URL ready"
              exec sleep infinity
          volumeMounts:
            - name: minio-ca
              mountPath: /root/.mc/certs/CAs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: minio-ca
          configMap:
            name: minio-ca
